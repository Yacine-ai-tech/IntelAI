# Top-level project metadata for IntelAI (the deployable app).
# The app runs via uvicorn (see Dockerfile / render.yaml); deps are in requirements.txt.
# The reusable persona library is packaged separately under packages/omnismart-personas.
# A source snapshot is also published to PyPI as `intelai` (read-only reference package,
# not meant to be installed as a dependency — no [project.dependencies] declared, same
# as the 0.1.x releases before it; deps live in requirements.txt for the real deploy).
[project]
name = "intelai"
version = "0.1.5"
description = "Persona-Aware AI Analytics & RAG Copilot — multi-domain KPI intelligence, GraphRAG-lite, ML forecasting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "Yacine" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
keywords = ["rag", "personas", "analytics", "kpi", "fastapi", "graphrag", "llm"]

[project.urls]
Homepage = "https://github.com/Yacine-ai-tech/IntelAI"
Source = "https://github.com/Yacine-ai-tech/IntelAI"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# pytest config lives in pytest.ini (testpaths=tests, e2e excluded).
