[pytest]
testpaths = tests
# Default suite = unit + integration (needs a DB; see tests/conftest.py).
# The Playwright e2e suite lives in tests/e2e and is opt-in (needs a browser + live
# frontend): run it explicitly with `pytest tests/e2e`.
addopts = -q --ignore=tests/e2e -m "unit"
markers =
    unit: purely in-memory unit tests
    integration: tests that depend on a database or live service
