name: Keep Render App Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render Free Tier from sleeping (15 min limit)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -s -f -o /dev/null "https://intelai.ysiddo-ai-projects.app/health" || echo "Ping failed but continuing"
