name: IntelAI CI & Production Smoke Tests

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  schedule:
    - cron: "0 3 * * *"   # Nightly smoke test at 03:00 UTC (after wake window starts)
  workflow_dispatch:        # Allow manual trigger

# ─── Production URLs (set these in each repo's GitHub Secrets) ────────────────
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION:   "20"
  INTELAI_URL:     ${{ secrets.INTELAI_URL    || '' }}
  INTELAI_INTERNAL_TOKEN: ${{ secrets.INTELAI_INTERNAL_TOKEN  }}

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 0 — Unit tests against the PR's own code (every other job below only
  # pings already-deployed production URLs, which for a PR haven't changed yet —
  # this is the only job that actually exercises the diff before it merges).
  # ═══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run unit tests (no database or provider credentials required)
        run: python -m pytest

  postgres-migrations:
    name: "PostgreSQL bootstrap and migration tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: intelai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Test isolated PostgreSQL bootstrap and migrations
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/intelai_test
          RUN_POSTGRES_MIGRATION_TESTS: "true"
        run: python -m pytest tests/test_pg_store_bootstrap.py -q -o addopts=""

  # ═══════════════════════════════════════════════════════════════════════════
  # Production deployments run outside this CI workflow.
  # This workflow validates source changes and performs post-merge smoke tests only.
  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — Wait for Deploy + Smoke Test all 6 live endpoints
  # NOTE: E2E tests run on GitHub Actions runners ONLY — never locally.
  # ═══════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install httpx pytest pytest-asyncio requests
      - name: Run Integration Tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTELAI_INTERNAL_TOKEN: ${{ secrets.INTELAI_INTERNAL_TOKEN }}
          # tests/test_exhaustive_api.py reads TEST_BASE_URL (defaulting to
          # http://localhost:8000, which doesn't exist on this runner) — this job
          # never set it, so all 71 tests failed with a connection error on every
          # single push to master, producing a GitHub Actions failure-email on
          # every push (the "constant failure alerts" reported live 2026-08-20).
          TEST_BASE_URL: ${{ env.INTELAI_URL }}
        run: |
          if [ -f "tests/test_exhaustive_api.py" ]; then
            python -m pytest tests/test_exhaustive_api.py -o addopts=""
          elif [ -f "tests/test_e2e.py" ]; then
            python -m pytest tests/test_e2e.py -o addopts=""
          else
            echo "No integration tests found."
          fi
