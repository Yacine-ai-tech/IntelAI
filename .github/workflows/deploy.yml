name: Deploy to Render

# Repo recreation dropped the GitHub→Render push webhook, so this workflow
# restores auto-deploy: every push to main/master triggers a Render deploy via the API.
on:
  push:
    branches: [main, master, develop]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          code=$(curl -fsS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "${{ secrets.DEPLOYMENT_API_ENDPOINT }}/services/${{ secrets.SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}') || { echo "deploy trigger failed"; exit 1; }
          echo "Deployment responded HTTP $code"
          cat /tmp/resp.json
