name: Production Health Verification

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Service Health
        run: |
          code=$(curl -fsS -o /tmp/resp.json -w "%{http_code}" \
            "https://intelai.ysiddo-ai-projects.app/health") || { echo "Health check failed"; exit 1; }
          echo "Production service responded HTTP $code"
          cat /tmp/resp.json
          ready_code=$(curl -fsS -o /tmp/ready.json -w "%{http_code}" \
            "https://intelai.ysiddo-ai-projects.app/ready") || { echo "Production readiness check failed"; exit 1; }
          echo "Production readiness returned HTTP $ready_code"
          cat /tmp/ready.json
